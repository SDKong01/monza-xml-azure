# NGINX Configuration for Keystone RBAC - Local Development
# Purpose: Production-ready gateway with auth_request integration
# Author: Backend Engineer
# Last Updated: 2025-01-27

# Global configuration
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Event processing configuration
events {
    worker_connectiovFrontend: Still keystone-frontend:3000 (internal container port)ns 1024;
    use epoll;
    multi_accept on;
}

# HTTP server configuration
http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # DNS resolver for Docker container networking
    resolver 127.0.0.11 valid=30s;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Upstream service definitions for Docker Compose services
    upstream backend_service {
        server keystone-backend:8000;
        keepalive 32;
    }
    
    upstream frontend_service {
        server keystone-frontend:3000;
        keepalive 32;
    }
    
    upstream auth_proxy_service {
        server keystone-oauth2-proxy:4180;
        keepalive 32;
    }
    
    # Main server configuration
    server {
        listen 80;
        server_name localhost;
        
        # Security and performance settings
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Internal authentication endpoint for auth_request
        location = /oauth2/auth {
            internal;
            proxy_pass http://auth_proxy_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Don't send the original request body to the auth service
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            # Timeout settings for auth requests
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }
        
        # OAuth2 proxy endpoints (login, callback, etc.)
        location /oauth2/ {
            proxy_pass http://auth_proxy_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Increase buffer sizes for large OAuth2/OIDC headers
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            
            # Support for websockets if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Protected API endpoints - require authentication
        location /api/ {
            # Perform authentication check
            auth_request /oauth2/auth;
            
            # Capture user information from auth response headers
            auth_request_set $user_email $upstream_http_x_auth_request_email;
            auth_request_set $user_name $upstream_http_x_auth_request_user;
            auth_request_set $user_roles $upstream_http_x_auth_request_groups;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;
            
            # Forward user identity to backend service (matching backend expectations)
            proxy_set_header X-Forwarded-Email $user_email;
            proxy_set_header X-Forwarded-Preferred-Username $user_name;
            proxy_set_header X-User-Roles $user_roles;
            proxy_set_header X-Access-Token $access_token;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Proxy to backend service
            proxy_pass http://backend_service;
            
            # Support for websockets if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Handle auth failures - redirect to login
            error_page 401 403 = @auth_redirect;
        }
        
        # Authentication redirect handler
        location @auth_redirect {
            return 302 /oauth2/start?rd=$request_uri;
        }
        
        # Frontend application - all other routes
        location / {
            # Proxy to frontend service
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Support for Next.js development server and websockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Handle connection and read timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
