services:
  db:
    image: postgres:16.4
    container_name: keystone-db
    networks:
      - keystone-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: keystone-keycloak
    networks:
      - keystone-net
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HTTPS_ENABLED: false
      KC_HEALTH_ENABLED: true
      KC_FRONTEND_URL: http://keycloak:8080
    command: start-dev
    depends_on:
      db:
        condition: service_healthy


  backend:
    build:
      context: ./tests/walking_skeleton/test_api
      dockerfile: Dockerfile
    container_name: keystone-backend
    networks:
      - keystone-net
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    command: python main.py
    depends_on:
      - keycloak

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: keystone-oauth2-proxy
    networks:
      - keystone-net
    # Remove external port exposure - oauth2-proxy only used internally by NGINX
    # ports:
    #   - "${OAUTH2_PROXY_PORT:-4180}:4180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_CLIENT_ID: keystone-frontend
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: keystone-frontend
      OAUTH2_PROXY_LOGIN_URL: ${OAUTH2_PROXY_LOGIN_URL}
      OAUTH2_PROXY_REDEEM_URL: ${OAUTH2_PROXY_REDEEM_URL}
      OAUTH2_PROXY_OIDC_JWKS_URL: ${OAUTH2_PROXY_OIDC_JWKS_URL}
      # OAUTH2_PROXY_UPSTREAMS removed - NGINX handles reverse proxying via auth_request
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_CA_VERIFICATION: "true"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
    command:
      - --cookie-secure=false
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --reverse-proxy=true
    depends_on:
      - keycloak
      - backend

  frontend:
    build:
      context: ./tests/walking_skeleton/test_front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_OAUTH2_PROXY_URL: ${NEXT_PUBLIC_OAUTH2_PROXY_URL}
    container_name: keystone-frontend
    volumes:
      - ./tests/walking_skeleton/test_front:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
    networks:
      - keystone-net
    depends_on:
      - backend

  nginx:
    image: nginx:1.21-alpine
    container_name: keystone-nginx
    networks:
      - keystone-net
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - oauth2-proxy
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  keystone-net:
    driver: bridge