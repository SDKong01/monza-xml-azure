##################
# KAINAM PLATFORM INFRASTRUCTURE
##################

task_id: "KEY-33-KAINAM-INFRA"
title: "Deploy Kainam Platform Infrastructure (App Runner Services)"
description: "Provision the core AWS App Runner services for the Kainam Platform frontend and backend, and associate the public-facing custom domain."
agent: "DevOps Engineer"
status: "Partially Complete"
sprint: 5
story_points: 8
dependencies:
  - "KEY-35-KAINAM-CICD" # This is now blocked until images exist in ECR
specifications:
  terraform_resources:
    - "aws_apprunner_service"
    - "aws_apprunner_custom_domain_association"
    - "aws_route53_record"
  app_runner_services:
    - name: "kainam-api-dev"
      image_identifier: "aws_ecr_repository.kainam_api.repository_url"
    - name: "kainam-front-dev"
      image_identifier: "aws_ecr_repository.kainam_front.repository_url"
  custom_domain:
    domain_name: "platform-dev.kainam.app"
    target_service: "kainam-front-dev"
    certificate_ref: "arn:of:*.dev.kainam.app:certificate"
sub_tasks:
  - "1. Define and deploy the 'kainam-api-dev' App Runner service via Terraform, pulling its image from ECR."
  - "2. Define and deploy the 'kainam-front-dev' App Runner service via Terraform, pulling its image from ECR."
  - "3. Create the DNS A record for 'platform-dev.kainam.app'."
  - "4. Associate the custom domain with the 'kainam-front-dev' service."
acceptance_criteria:
  - "Both App Runner services are successfully provisioned and in a 'Running' state."
  - "The custom domain 'platform-dev.kainam.app' is 'Active' and successfully loads the frontend application."

