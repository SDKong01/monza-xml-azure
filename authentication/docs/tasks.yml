##################
# KAINAM PLATFORM KEYCLOAK CLIENTS
##################

task_id: "KEY-32-KAINAM-CLIENT-CONFIG"
title: "Configure Keycloak OIDC Clients for Kainam Platform"
description: "Create the new OIDC clients required for the Kainam Platform frontend and backend services to communicate with Keycloak."
agent: "DevOps Engineer"
status: "Partially Complete"
sprint: 5
story_points: 2
dependencies:
  - "KEY-33-KAINAM-INFRA"
specifications:
  action: "Manual configuration via Keycloak Admin Console in the 'kainam-dev' realm."
  clients:
    - client_id: "kainam-frontend"
      access_type: "public"
      valid_redirect_uris:
        - "https://wsavgpzs5x.us-east-2.awsapprunner.com/*"
    - client_id: "kainam-backend"
      access_type: "confidential"
      service_accounts_enabled: true
  secrets_management:
    - "Store the secret generated for the 'kainam-backend' client in AWS Secrets Manager."
sub_tasks:
  - "1. Log into the Keycloak Admin Console."
  - "2. Create the 'kainam-frontend' public client."
  - "3. Create the 'kainam-backend' confidential client."
  - "4. Retrieve the secret for the 'kainam-backend' client."
  - "5. Store the secret in AWS Secrets Manager."
acceptance_criteria:
  - "Both OIDC clients are created and visible in the Keycloak Admin Console."
  - "The client secret for 'kainam-backend' is securely stored in AWS Secrets Manager."

