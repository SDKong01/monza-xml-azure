# KAINAM PLATFORM FOUNDATION (ECR & IAM)
##################

task_id: "KEY-34-KAINAM-FOUNDATION"
title: "Provision Foundational Infrastructure for Kainam Platform"
description: "Create the ECR repositories to store the Kainam Platform's container images and the IAM roles required for the CI/CD pipelines to operate."
agent: "DevOps Engineer"
status: "Complete"
sprint: 5
story_points: 1
dependencies: []
specifications:
  terraform_resources:
    - "aws_ecr_repository"
    - "aws_iam_role"
  ecr_repositories:
    - name: "kainam-api-ecr-dev"
    - name: "kainam-front-ecr-dev"
  iam_roles:
    - "Create an IAM Role that grants CI/CD services (e.g., GitHub Actions) permission to push images to the new ECR repositories."
sub_tasks:
  - "1. Define and deploy the two new 'aws_ecr_repository' resources via Terraform."
  - "2. Define and deploy the new IAM role and attach the necessary ECR push policies."
acceptance_criteria:
  - "Both ECR repositories are created and visible in the AWS Console."
  - "The IAM role for CI/CD is created with the correct permissions."

