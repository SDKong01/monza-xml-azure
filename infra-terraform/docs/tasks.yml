task_id: "CFGI-003"
title: "Deploy Foundation Infrastructure - Security Groups"
description: "Create security groups for App Runner VPC Connector and Monza EC2 instance communication"
agent: "DevOps Engineer"
status: "Deferred"
dependencies: ["CFGI-002"]
note: "Security groups are created as part of App Runner (CFGI-007) and Monza EC2 (CFGI-010) modules - no standalone deployment needed"
specifications:
  terraform_resources:
    - "aws_security_group (vpc_connector, monza)"
    - "Note: VPC Connector SG created by App Runner module"
    - "Note: Monza SG defined in ec2-monza module"
  security_groups:
    vpc_connector:
      name: "cfgi-prod-vpc-connector-sg"
      purpose: "App Runner VPC Connector egress to VPC"
      managed_by: "App Runner VPC Connector module"
    monza_ec2:
      name: "cfgi-prod-monza-sg"
      ingress:
        - "SSH (22) from 0.0.0.0/0"
        - "ClickHouse HTTP (8123) from VPC Connector SG"
        - "ClickHouse Native (9000) from VPC Connector SG"
        - "Airflow Web UI (8080) from 0.0.0.0/0"
      egress: "All outbound traffic"
acceptance_criteria:
  - "VPC Connector security group created by App Runner module"
  - "Monza security group allows App Runner backend communication"
  - "Security group IDs available as module outputs"
  - "No generic ALB/Web/DB security groups created (not applicable to App Runner architecture)"

