##################
# CFGI CLIENT INFRASTRUCTURE DEPLOYMENT
##################

task_id: "CFGI-SETUP"
title: "CFGI Client Multi-Tenant Infrastructure Setup"
description: "Complete infrastructure deployment for CFGI client including Kimball (App Runner services) and Monza (EC2) products in client AWS account following multi-tenant architecture pattern"
agent: "DevOps Engineer"
status: "Pending"
dependencies: []
specifications:
  terraform_resources:
    - "clients/cfgi directory structure"
    - "module.vpc (foundation)"
    - "module.security_groups (foundation)"
    - "module.iam_roles (foundation)"
    - "module.ecr_kimball (Kimball product)"
    - "module.kimball_frontend (App Runner)"
    - "module.kimball_backend (App Runner with VPC connector)"
    - "module.codepipeline_kimball (CI/CD)"
    - "module.route53_records_kimball (DNS)"
    - "module.ec2_monza (to be created)"
  networking:
    vpc_cidr: "10.10.0.0/16"
    region: "us-east-2"
    availability_zones: ["us-east-2a", "us-east-2b"]
    public_subnets: ["10.10.1.0/24", "10.10.2.0/24"]
    private_subnets: ["10.10.101.0/24", "10.10.102.0/24"]
  kimball_product:
    frontend:
      service: "App Runner"
      cpu: 1024
      memory: 2048
      domain: "kimball-cfgi.kainam.app"
      repos: "kainamAI/kimball-frontend"
    backend:
      service: "App Runner"
      cpu: 1024
      memory: 2048
      vpc_connector: true
      repos: "kainamAI/kimball-fastapi"
    ci_cd:
      source_branch: "dev"
      pipelines: ["frontend", "api"]
  monza_product:
    instance_type: "TBD - awaiting client specs"
    services: ["ClickHouse", "Airflow"]
    bootstrap_script: "deploy_monza_bootstrap.sh.tpl"
  aws_configuration:
    profile: "cfgi-sso"
    account: "CFGI AWS Account"
    state_bucket: "cfgi-tf-state"
  naming_convention:
    project_name: "cfgi"
    environment: "prod"
    pattern: "cfgi-prod-{resource-type}"
  manual_operations:
    - "Create S3 bucket cfgi-tf-state with versioning"
    - "Create DynamoDB table cfgi-tf-state-lock"
    - "Request ACM certificate for *.kainam.app in CFGI account"
    - "Validate ACM cert via DNS records in Kainam Route 53"
    - "Setup CodeStar connection for GitHub (kainamAI org)"
    - "Add custom domain to App Runner frontend service"
    - "Initial Docker image push to ECR repositories"
acceptance_criteria:
  - "Directory structure clients/cfgi/ created with all configuration files"
  - "VPC cfgi-prod-vpc (10.10.0.0/16) deployed with public/private subnets"
  - "Security groups configured for App Runner and EC2 communication"
  - "IAM roles created for GitHub Actions, App Runner, and EC2"
  - "ECR repositories created: cfgi-prod-kimball-frontend-ecr and cfgi-prod-kimball-api-ecr"
  - "App Runner frontend service deployed and healthy"
  - "App Runner backend service deployed with VPC connector"
  - "CodePipeline operational for both frontend and backend"
  - "Custom domain kimball-cfgi.kainam.app resolves with HTTPS"
  - "Route 53 DNS records created in Kainam hosted zone"
  - "GitHub CodeStar connection authorized"
  - "EC2 Monza module created in modules/ec2-monza/"
  - "Monza bootstrap script created in scripts/"
  - "Client deployment README created with manual operations checklist"
  - "ENVIRONMENT_STRATEGY.md updated with multi-tenant architecture"
  - "All Terraform validation tests pass"
  - "End-to-end connectivity verified between services"

